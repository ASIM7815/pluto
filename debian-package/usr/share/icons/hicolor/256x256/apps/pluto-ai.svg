<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#0f0f23" stroke="#ff3344" stroke-width="4"/>
  
  <!-- Outer ring -->
  <circle cx="128" cy="128" r="90" fill="none" stroke="#ff3344" stroke-width="3" stroke-dasharray="8 12" opacity="0.8"/>
  
  <!-- Middle ring -->
  <circle cx="128" cy="128" r="70" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 8" opacity="0.6"/>
  
  <!-- Core -->
  <circle cx="128" cy="128" r="50" fill="url(#coreGradient)"/>
  
  <!-- Highlight -->
  <ellipse cx="110" cy="105" rx="20" ry="15" fill="rgba(255,255,255,0.4)"/>
  
  <!-- Gradients -->
  <defs>
    <radialGradient id="coreGradient" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ff3344"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </radialGradient>
  </defs>
  
  <!-- Letter P -->
  <text x="128" y="145" font-family="Arial, sans-serif" font-size="72" font-weight="bold" 
        fill="white" text-anchor="middle" opacity="0.9">P</text>
</svg>
