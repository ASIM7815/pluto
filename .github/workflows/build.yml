name: Build PLUTO .deb (Tauri + Rust)

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: pluto-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            pluto-cargo-${{ runner.os }}-

      - name: Install Linux (Tauri) dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config \
            libxcb1-dev libxcb-render0-dev libxcb-shm0-dev libxcb-randr0-dev \
            libxdo-dev libxkbcommon-dev libwayland-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev libgbm-dev libdrm-dev libegl-dev \
            libasound2-dev libclang-dev clang alsa-utils \
            xvfb xdotool imagemagick scrot wmctrl xclip espeak-ng

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check frontend
        run: npx tsc --noEmit

      - name: Build frontend (static export)
        run: npm run build

      - name: Rust unit tests
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --lib 2>&1 \
            | grep -vE "^\\s+Compiling " | tee /tmp/rust-test.log > /dev/null
          rc=$?
          tail -n 60 /tmp/rust-test.log
          if [ "$rc" -ne 0 ]; then
            # Compact diagnostics: error blocks, assertion failures, summary.
            {
              grep -nE -A4 -B1 "error\\[|^error:|^error |panicked at|assertion .*failed|^failures:|test result:|^warning:" /tmp/rust-test.log
              echo "--- tail ---"
              tail -n 30 /tmp/rust-test.log
            } | head -n 200 > /tmp/diag-rust.txt
            cp /tmp/diag-rust.txt /tmp/diag-1.txt
          fi
          exit "$rc"

      - name: Build Tauri app and Debian package
        run: |
          set -o pipefail
          npm run build:deb 2>&1 | tee /tmp/deb-build.log > /dev/null
          rc=$?
          tail -n 60 /tmp/deb-build.log
          if [ "$rc" -ne 0 ]; then
            tail -n 200 /tmp/deb-build.log > /tmp/diag-deb.txt
            cp /tmp/diag-deb.txt /tmp/diag-1.txt
          fi
          exit "$rc"

      # This sandbox cannot stream GitHub's log blobs, so failures are posted
      # as commit comments (readable via the REST API) and also pushed as a
      # small file on the branch as a fallback channel.
      - name: Report build diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          diag=""
          if [ -f /tmp/diag-1.txt ]; then diag=/tmp/diag-1.txt; fi
          if [ -z "$diag" ]; then
            echo "No diagnostics captured"
            exit 0
          fi
          {
            echo "## PLUTO CI diagnostics for ${{ github.sha }}"
            echo ""
            echo '```text'
            head -c 25000 "$diag"
            echo '```'
          } > /tmp/body.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F "body=$(cat /tmp/body.md)" >/dev/null 2>&1 && echo "Comment posted" || echo "Comment failed - falling back to git"
          cp "$diag" "ci-diag-${{ github.sha }}.log"
          git config user.name "pluto-build"
          git config user.email "pluto-build@users.noreply.github.com"
          git add "ci-diag-${{ github.sha }}.log"
          git commit -m "ci: build diagnostics for ${{ github.sha }}" >/dev/null 2>&1 || true
          git push origin "HEAD:$GITHUB_REF_NAME" 2>&1 || echo "Diagnostics push failed"

      - name: Copy / rename .deb artifact
        if: success()
        run: |
          mkdir -p dist
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -n 1)
          if [ -z "$DEB" ]; then
            echo "::error::No .deb produced by Tauri bundler"
            exit 1
          fi
          cp "$DEB" dist/Pluto_1.0.0_amd64.deb
          ls -lh dist/

      - name: Install the real .deb and launch from /usr/bin
        if: success()
        run: |
          set -e
          # Install through apt (resolves the package's declared dependencies)
          sudo apt-get install -y ./dist/Pluto_1.0.0_amd64.deb
          {
            echo "## Installed .deb verification"
            dpkg -s pluto | grep -E "^(Package|Version|Status):"
            test -x /usr/bin/pluto && echo "- BINARY_OK: /usr/bin/pluto is executable"
            test -f /usr/share/applications/Pluto.desktop && echo "- DESKTOP_OK: /usr/share/applications/Pluto.desktop exists"
            grep -q "Exec=pluto" /usr/share/applications/Pluto.desktop && echo "- DESKTOP_EXEC_OK: Exec=pluto"
            test -f /usr/share/icons/hicolor/512x512/apps/pluto.png && echo "- ICON_OK: hicolor 512x512 pluto.png"
          } >> "$GITHUB_STEP_SUMMARY"
          xvfb-run -a -s "-screen 0 1280x900x24" bash -c '
            export WEBKIT_DISABLE_COMPOSITING_MODE=1
            /usr/bin/pluto > /tmp/pluto-installed.log 2>&1 &
            APP_PID=$!
            sleep 12
            if kill -0 "$APP_PID" 2>/dev/null; then
              echo "- INSTALLED_APP_ALIVE: /usr/bin/pluto ran 12s under Xvfb" >> "$GITHUB_STEP_SUMMARY"
              scrot /tmp/pluto_installed.png && echo "- INSTALLED_SCREENSHOT_OK: UI rendered" >> "$GITHUB_STEP_SUMMARY"
              kill "$APP_PID"
            else
              echo "- INSTALLED_APP_EXITED_EARLY" >> "$GITHUB_STEP_SUMMARY"
              cat /tmp/pluto-installed.log || true
              exit 1
            fi
          '
          echo "- INSTALL_TEST_DONE" >> "$GITHUB_STEP_SUMMARY"
          sudo apt-get remove -y pluto >/dev/null 2>&1 || true

      - name: Smoke test GUI under Xvfb
        if: success()
        run: |
          set -e
          APP=./src-tauri/target/release/pluto
          chmod +x "$APP"
          xvfb-run -a -s "-screen 0 1280x900x24" bash -c '
            export WEBKIT_DISABLE_COMPOSITING_MODE=1
            "$1" > /tmp/pluto-app.log 2>&1 &
            APP_PID=$!
            sleep 12
            if kill -0 "$APP_PID" 2>/dev/null; then
              echo "PLUTO_APP_ALIVE after 12s"
              scrot /tmp/pluto_smoke.png && echo "SMOKE_SCREENSHOT_OK"
              kill "$APP_PID"
            else
              echo "PLUTO_APP_EXITED_EARLY"
              cat /tmp/pluto-app.log || true
              exit 1
            fi
          ' _ "$APP"

      - name: Rust smoke tests (clipboard + screenshot under Xvfb)
        if: success()
        run: |
          xvfb-run -a -s "-screen 0 1280x900x24" bash -c 'cargo test --manifest-path src-tauri/Cargo.toml --test smoke -- --ignored --nocapture'

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pluto-deb
          path: dist/Pluto_1.0.0_amd64.deb

      - name: Publish .deb back to the repo
        if: success()
        run: |
          git config user.name "pluto-build"
          git config user.email "pluto-build@users.noreply.github.com"
          rm -f ci-diag-*.log 2>/dev/null || true
          git rm -f --ignore-unmatch ci-diag-*.log >/dev/null 2>&1 || true
          git add dist/Pluto_1.0.0_amd64.deb src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "No build artifacts to commit"
          else
            git commit -m "build: Pluto_1.0.0_amd64.deb (Tauri + Rust)"
            git push origin HEAD:${{ github.ref_name }}
          fi
