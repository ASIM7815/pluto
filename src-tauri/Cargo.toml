[package]
name = "pluto"
version = "1.0.0"
description = "PLUTO - Linux desktop AI assistant"
authors = ["PLUTO AI Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pluto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
base64 = "0.22"
sysinfo = "0.35"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1"
walkdir = "2"
which = "7"
cpal = "0.15"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "time", "fs", "process", "macros", "rt"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
